# ALPM-FS Configuration File
# Bootable Alpine Linux System Configuration

# ============================================
# Filesystem Configuration
# ============================================

# Root filesystem type (ext4, xfs, btrfs, f2fs)
ROOT_FS_TYPE="ext4"

# Root filesystem mount options
ROOT_FS_OPTS="rw,relatime"

# EFI partition size in MiB
# Use (power-of-two - 1) so EFI_END = 1 + EFI_SIZE lands on an aligned
# boundary (parted --align=opt warns otherwise on devices reporting
EFI_SIZE=1023

# ============================================
# Alpine Repository
# ============================================

# Alpine version (e.g., v3.22, v3.21, edge) (Minor version automatically takes latest)
# WARNING: Needs "edge" to run "linux-stable" (expect some bugs too)
# If this is changed between runs any progress in alpinestein chroot would be lost
ALPINE_VERSION="edge"

# Enable testing repository (experimental/bleeding-edge packages)
# When enabled, testing repo is added as @testing tagged repository
# Tagged repos are NOT used by default - must explicitly request with @testing suffix
#
# Example used in the source code: apk add refind@testing (pulls refind from edge/testing repo)
#
# WARNING: Testing packages have NO official support and may break your system
# WARNING: Do NOT mix stable and edge main/community repos - only use @testing tag
ENABLE_TESTING="yes"

# Alpine mirror
ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine"

# ============================================
# zram Configuration
# ============================================

# zram size in MiB
ZRAM_SIZE=8192

# zram compression algorithm (lzo, lz4, zstd)
ZRAM_ALGO="zstd"

# ============================================
# Boot Configuration
# ============================================

# Bootloader choice (grub or refind)
# NOTE: refind requires ENABLE_TESTING="yes" (available in edge/testing repository)
BOOTLOADER="grub"

# GRUB timeout in seconds
GRUB_TIMEOUT=1

# GRUB menu entry name
MENUENTRY="ALPM-FS"

# rEFInd timeout in seconds
REFIND_TIMEOUT=20

# rEFInd resolution (e.g., 1920 1080)
REFIND_RESOLUTION="1920 1080"

# Extra kernel command line parameters (console, quiet, etc) Both for refind and grub
# Note: rootfstype and modules are auto-generated based on ROOT_FS_TYPE
# The rest is up to you to figure out for your hardware...
# This example setting fixes my Iris laptop's GPU

KERNEL_CMDLINE_EXTRA="console=tty0 console=ttyS0,115200 i915.enable_guc=0"

# ============================================
# System Packages
# ============================================
# Core system packages

# x86_64 kernel options:
# linux-lts (Long Term Support, most hardware)

# linux-stable (latest stable kernel) # NEEDS ALPINE_VERSION="edge" enabled
# and on alpine this one means trouble
# linux-virt (minimal VM kernel, omits a lot of drivers)
# linux-openpax (OpenPAX security memory patches)

KERNEL_FLAVOR="linux-stable"

# Minimal firmware set per Alpine wiki: -none meta + -other.

CORE_PACKAGES="$KERNEL_FLAVOR linux-firmware-none linux-firmware-other acpi mkinitfs  "

# elogind: provides logind-equivalent session/seat mgmt without systemd.
# Required by sway/wayland/polkit and most modern desktop bits. TODO: seatd only setup
CORE_PACKAGES2="doas elogind"

# linux-firmware for all
# ============================================
# HARDWARE #Optional/Depending on HW
# ============================================
# Uncomment only one of these based on your CPU vendor

# Intel
# Notes:
# - intel-media-driver (iHD) is the VAAPI backend for Broadwell+/Gen9+
#   including Tiger/Alder/Raptor Lake. The older libva-intel-driver (i965)
#   covers only Gen4-Gen9 and doesnt support Gen11+, so we omit it.
HW_GROUP_INTEL="linux-firmware-intel intel-gmmlib intel-media-driver mesa-vulkan-intel"

#HW_GROUP_AMD="linux-firmware-amdgpu"

# ============================================
# GRAPHICS #Optional/Can leave just mesa
# ============================================

GP_GROUP_MESA="mesa mesa-gl mesa-va-gallium mesa-dri-gallium"

# ============================================
# PKGS
# ============================================

# System
SYSTEM_PACKAGES="openrc openrc-init util-linux coreutils e2fsprogs dosfstools dbus dbus-openrc acpid busybox-openrc busybox-extras alpine-conf zram-init"

# /dev mngmnt #can be replaced by: `busybox-mdev-openrc`
# then make sure to update boot services (mdev in SERVICES_BOOT, no udev* in sysinit)
DEV_PACKAGES="eudev eudev-openrc"

# ============================================
# WiFi Configuration
# ============================================
# Uses iwd (iNet wireless daemon) with its built-in DHCP/IP config.
# openresolv lets iwd write /etc/resolv.conf when connecting.
# Connect from CLI with: iwctl station wlan0 connect <SSID>

WIFI_NEEDED="yes"
WIFI_PACKAGES="iwd openresolv"

SERVICES_DEFAULT_WIFI="iwd"

# Fallback DNS server written to /etc/resolv.conf at build time.
DNS_FALLBACK="1.1.1.1"

# NetworkManager alternative (heavier, GUI-friendly, does both wifi + eth):
# WIFI_PACKAGES="networkmanager networkmanager-wifi networkmanager-cli wpa_supplicant"
# SERVICES_DEFAULT_WIFI="networkmanager"

# ============================================
# Boot Services
# ============================================

# Services to add to sysinit runlevel
SERVICES_SYSINIT="devfs dmesg udev udev-trigger udev-settle"

# Services to add to boot runlevel
SERVICES_BOOT="hwclock modules sysctl hostname bootmisc syslog localmount zram-init"

# Services to add to shutdown runlevel
SERVICES_SHUTDOWN="mount-ro killprocs savecache"

# Services to add to default runlevel
SERVICES_DEFAULT="acpid dbus"

# ============================================
# User Configuration #Please change me
# ============================================

# Hostname
HOSTNAME="alpmfs"

# Default root password
ROOT_PASSWORD="alpine"

# Unprivileged user (created on first boot / by mods like sway_user.sh)
# Leave empty to skip user creation.
USER="alpm"
USER_PASSWORD="alpine"

# System locale (run 'locale -a' to see all options)
# Common options: C.UTF-8, en_US.UTF-8, en_GB.UTF-8, etc.
LOCALE="en_GB.UTF-8"

# Additional packages or nice-to-haves
EXTRA_PACKAGES="iptables pciutils ufw ip6tables util-linux wget curl tar zstd hwinfo lshw usbutils micro bash musl-locales kbd-bkeymaps kbd"
